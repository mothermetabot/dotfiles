# ============================================================
# General
# ============================================================

# Good TERM value for Neovim/TUI applications.
set -g default-terminal "xterm-256color"

set -g mouse on
set -g focus-events on

# Large scrollback.
set -g history-limit 50000

# Responsive Escape/Alt handling.
set -g escape-time 10
# repeat-time lives in tmux.linux.conf: psmux does not implement it and warns
# on startup, and this file is shared with it.

# Start windows and panes at 1.
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# Vi keys in copy mode and command prompts.
set -g mode-keys vi
set -g status-keys vi

# psmux/PowerShell niceties.


# ============================================================
# Prefix
# ============================================================

# Ctrl-t instead of Ctrl-b.
unbind-key C-b
set -g prefix C-t

# Ctrl-t Ctrl-t sends a literal Ctrl-t to the application.
#
# Linux only, because the two differ: tmux keeps `send-prefix` on the OLD key
# when you change `prefix`, so it has to be rebound explicitly. psmux rebinds
# it automatically - `list-keys` shows `-T prefix C-t send-prefix` even with a
# config containing nothing but `set -g prefix C-t` - so the line is redundant
# there.
if-shell 'test -d /etc' 'bind-key C-t send-prefix' 'set -g @noop 1'


# ============================================================
# Command mode
# ============================================================

# Prefix + ; and Prefix + :
#
# `;` is the ergonomic one (no Shift). This used to be Alt-;, but Alt is the
# tiling WM modifier on both platforms - komorebi on Windows, i3 on Linux - so
# the WM swallowed it before the multiplexer ever saw it.
#
# This overrides tmux's default `;` = last-pane; use Prefix + o for zoom or
# Ctrl-h/j/k/l to move between panes.
bind-key ';' command-prompt -p ":"
bind-key ':' command-prompt -p ":"


# ============================================================
# Splits
# ============================================================

# Prefix + h
# Panes stacked vertically: one above the other.
# (tmux calls this -v, "split along a horizontal line".)
bind-key h split-window -v -c "#{pane_current_path}"

# Prefix + v
# Panes side by side.
bind-key v split-window -h -c "#{pane_current_path}"

# `s` is no longer a split - it is the fzf session picker. See the fzf section
# below.


# ============================================================
# Pane navigation
# ============================================================

# Ctrl-h/j/k/l is installed by psmux-vim-navigator.
#
# C-h -> left
# C-j -> down
# C-k -> up
# C-l -> right
#
# No prefix required.
#
# If Neovim is active, the plugin passes these keys to Neovim.
# At the edge of a Neovim split, vim-tmux-navigator moves into
# the surrounding psmux pane.


# ============================================================
# Pane resizing
# ============================================================

# Prefix + Shift-H/J/K/L
bind-key -r H resize-pane -L 5
bind-key -r J resize-pane -D 5
bind-key -r K resize-pane -U 5
bind-key -r L resize-pane -R 5

# Prefix + =
# Equalize panes.
bind-key = select-layout tiled

# Prefix + o
# Zoom/unzoom current pane.
bind-key o resize-pane -Z


# ============================================================
# Copy / selection mode
# ============================================================

# Prefix + Space
#
# Enter copy mode and immediately begin a selection.
bind-key Space copy-mode \; send-keys -X begin-selection

# Also make v work like Neovim once already in copy mode.
bind-key -T copy-mode-vi v send-keys -X begin-selection

# Ctrl-v toggles rectangular/block selection in copy mode.
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle

# psmux already provides:
#
#   h/j/k/l    move
#   w/b        word motion
#   0/$        line boundaries
#   g/G        top/bottom
#   /          search
#   y          copy selection to Windows clipboard + exit
#   Enter      copy selection to Windows clipboard + exit
#   q/Escape   cancel
#
# No tmux-yank plugin is required.


# ============================================================
# Windows / "tabs"
# ============================================================

# Prefix + c
# New window in current directory.
bind-key c new-window -c "#{pane_current_path}"

# Prefix + t
# Prompt for a name, then create a new window.
bind-key t command-prompt -p "Tab name:" \
    "new-window -n '%%' -c '#{pane_current_path}'"

# Prefix + n/p
bind-key n next-window
bind-key p previous-window


# ============================================================
# Neovim-style command aliases
# ============================================================

# Splits
set -g command-alias 'sp=split-window -v -c "#{pane_current_path}"'
set -g command-alias 'split=split-window -v -c "#{pane_current_path}"'

set -g command-alias 'vs=split-window -h -c "#{pane_current_path}"'
set -g command-alias 'vsplit=split-window -h -c "#{pane_current_path}"'

# Panes
set -g command-alias 'q=kill-pane'
set -g command-alias 'only=kill-pane -a'

# Session
set -g command-alias 'qa=kill-session'

# Windows as Vim tabs
set -g command-alias 'tabnew=new-window -c "#{pane_current_path}"'
set -g command-alias 'tabn=next-window'
set -g command-alias 'tabnext=next-window'
set -g command-alias 'tabp=previous-window'
set -g command-alias 'tabprevious=previous-window'
set -g command-alias 'tabclose=kill-window'

# Windows as Vim buffers
set -g command-alias 'bn=next-window'
set -g command-alias 'bnext=next-window'
set -g command-alias 'bp=previous-window'
set -g command-alias 'bprevious=previous-window'
set -g command-alias 'bd=kill-window'
set -g command-alias 'bdelete=kill-window'

# `reload` is defined per platform, in tmux.linux.conf / tmux.windows.conf:
# tmux can re-source a ~ path directly, psmux has to go out through the shell.


# ============================================================
# Platform split - KEEP THIS LAST
# ============================================================
#
# One config for both. Nothing generated, nothing outside the repo.
#
#   Linux    tmux finds this at ~/.config/tmux/tmux.conf (stowed symlink)
#   Windows  psmux is pointed here by $PSMUX_CONFIG_FILE (bootstrap.ps1 sets it
#            at User scope; powershell/profile.ps1 sets it as a fallback)
#
# `test -d /etc` is the platform probe: true under Linux's shell, false under
# psmux's (PowerShell), whether `test` is missing or scoop's coreutils has it.
#
# ---------------------------------------------------------------------------
# Why Linux gets a tidy source-file and Windows gets inlined commands
# ---------------------------------------------------------------------------
# Not for lack of trying. Three psmux 3.3.8 limits, all verified:
#
#  1. source-file expands NOTHING - not ~, not $HOME, not $USERPROFILE,
#     not ${USERPROFILE}, not %USERPROFILE% - and resolves relative paths
#     against the CWD. Only an absolute path works, and no absolute path is
#     valid on every machine.
#  2. The obvious workaround, `run-shell "psmux source-file <expanded path>"`,
#     DOES load the file - but the client it spawns RESETS THE KEY TABLE TO
#     DEFAULTS, silently discarding every binding set above. Options survive,
#     bindings do not, and it happens asynchronously so reordering cannot fix
#     it. This is the bug that made prefix h/v/; vanish while b/s/r survived.
#  3. if-shell accepts only ONE command. Neither `;` nor `\;` separates them;
#     both get swallowed into the preceding argument.
#
# So Windows gets one if-shell per command. `set -g @noop 1` is the do-nothing
# branch. If psmux ever expands paths in source-file, collapse this whole block
# into a single line mirroring the Linux one.

# --- Linux: everything in one file ------------------------------------------
if-shell 'test -d /etc'     'source-file -q ~/.config/tmux/tmux.linux.conf'     "set -g @plugin 'psmux-plugins/ppm'"

# --- Windows: inlined, one command per if-shell -----------------------------
if-shell 'test -d /etc'     'set -g @noop 1'     "set -g @plugin 'psmux-plugins/psmux-vim-navigator'"

# PPM must run after its @plugin lines. Its own Prefix+I/U/M bindings shell out
# to `pwsh`, so PowerShell 7 must be installed or plugin install fails silently.
if-shell 'test -d /etc'     'set -g @noop 1'     "run '~/.psmux/plugins/ppm/ppm.ps1'"

# psmux-only option; tmux would warn about it.
if-shell 'test -d /etc'     'set -g @noop 1'     'set -g prediction-dimming off'

# fzf pickers. ~ is expanded by the SHELL display-popup launches, not by psmux,
# and PowerShell's ~ is %USERPROFILE% - where bootstrap.ps1 junctions .config.
if-shell 'test -d /etc'     'set -g @noop 1'     "bind-key b display-popup -E -w 80% -h 70% 'powershell -NoProfile -ExecutionPolicy Bypass -File ~/.config/tmux/scripts/fzf-window.ps1'"

if-shell 'test -d /etc'     'set -g @noop 1'     "bind-key s display-popup -E -w 60% -h 50% 'powershell -NoProfile -ExecutionPolicy Bypass -File ~/.config/tmux/scripts/fzf-session.ps1'"

# Reload goes out through the shell, which expands the variable for us. Safe
# here because it re-sources the ENTRY file, so the bindings come back with it.
if-shell 'test -d /etc'     'set -g @noop 1'     "bind-key r run-shell 'psmux source-file \$env:PSMUX_CONFIG_FILE'"

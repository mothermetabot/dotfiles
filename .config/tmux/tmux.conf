# ============================================================
# General
# ============================================================

# Good TERM value for Neovim/TUI applications.
set -g default-terminal "xterm-256color"

set -g mouse on
set -g focus-events on

# Large scrollback.
set -g history-limit 50000

# Responsive Escape/Alt handling.
set -g escape-time 10
# repeat-time lives in plugins.linux.conf: psmux does not implement it and
# warns on startup, and this file is shared with it.

# Start windows and panes at 1.
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# Vi keys in copy mode and command prompts.
set -g mode-keys vi
set -g status-keys vi

# psmux/PowerShell niceties.
set -g prediction-dimming off


# ============================================================
# Prefix
# ============================================================

# Ctrl-t instead of Ctrl-b.
unbind-key C-b
set -g prefix C-t

# Ctrl-t Ctrl-t sends Ctrl-t to the application.
bind-key C-t send-prefix


# ============================================================
# Command mode
# ============================================================

# Prefix + ; and Prefix + :
#
# `;` is the ergonomic one (no Shift). This used to be Alt-;, but Alt is the
# tiling WM modifier on both platforms - komorebi on Windows, i3 on Linux - so
# the WM swallowed it before the multiplexer ever saw it.
#
# This overrides tmux's default `;` = last-pane; use Prefix + o for zoom or
# Ctrl-h/j/k/l to move between panes.
bind-key ';' command-prompt -p ":"
bind-key ':' command-prompt -p ":"


# ============================================================
# Splits
# ============================================================

# Prefix + h
# Panes stacked vertically: one above the other.
# (tmux calls this -v, "split along a horizontal line".)
bind-key h split-window -v -c "#{pane_current_path}"

# Prefix + v
# Panes side by side.
bind-key v split-window -h -c "#{pane_current_path}"

# `s` is no longer a split - it is the fzf session picker. See the fzf section
# below.


# ============================================================
# Pane navigation
# ============================================================

# Ctrl-h/j/k/l is installed by psmux-vim-navigator.
#
# C-h -> left
# C-j -> down
# C-k -> up
# C-l -> right
#
# No prefix required.
#
# If Neovim is active, the plugin passes these keys to Neovim.
# At the edge of a Neovim split, vim-tmux-navigator moves into
# the surrounding psmux pane.


# ============================================================
# Pane resizing
# ============================================================

# Prefix + Shift-H/J/K/L
bind-key -r H resize-pane -L 5
bind-key -r J resize-pane -D 5
bind-key -r K resize-pane -U 5
bind-key -r L resize-pane -R 5

# Prefix + =
# Equalize panes.
bind-key = select-layout tiled

# Prefix + o
# Zoom/unzoom current pane.
bind-key o resize-pane -Z


# ============================================================
# Copy / selection mode
# ============================================================

# Prefix + Space
#
# Enter copy mode and immediately begin a selection.
bind-key Space copy-mode \; send-keys -X begin-selection

# Also make v work like Neovim once already in copy mode.
bind-key -T copy-mode-vi v send-keys -X begin-selection

# Ctrl-v toggles rectangular/block selection in copy mode.
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle

# psmux already provides:
#
#   h/j/k/l    move
#   w/b        word motion
#   0/$        line boundaries
#   g/G        top/bottom
#   /          search
#   y          copy selection to Windows clipboard + exit
#   Enter      copy selection to Windows clipboard + exit
#   q/Escape   cancel
#
# No tmux-yank plugin is required.


# ============================================================
# Windows / "tabs"
# ============================================================

# Prefix + c
# New window in current directory.
bind-key c new-window -c "#{pane_current_path}"

# Prefix + t
# Prompt for a name, then create a new window.
bind-key t command-prompt -p "Tab name:" \
    "new-window -n '%%' -c '#{pane_current_path}'"

# Prefix + n/p
bind-key n next-window
bind-key p previous-window


# ============================================================
# FZF pickers and reload
# ============================================================
#
# Prefix + b   fzf window picker, across all sessions
# Prefix + s   fzf session picker
# Prefix + r   reload
#
# Paths below use `~` deliberately. psmux does NOT expand ~ in `source-file`,
# but these run in the SHELL (display-popup / run-shell), which does. On
# Windows PowerShell's ~ is %USERPROFILE%, where bootstrap.ps1 junctions
# .config - so ~/.config/tmux/scripts resolves back into this repo.
#
# The old Prefix + b pointed at ~/.config/tmux/select-window.ps1 via `pwsh`.
# That script was never in this repo, pwsh is not installed, and the ~ never
# expanded - so fzf started with no input and fell back to listing files.

if-shell 'test -d /etc' \
    "bind-key b display-popup -E -w 80% -h 70% '~/.config/tmux/scripts/fzf-window.sh'" \
    "bind-key b display-popup -E -w 80% -h 70% 'powershell -NoProfile -ExecutionPolicy Bypass -File ~/.config/tmux/scripts/fzf-window.ps1'"

if-shell 'test -d /etc' \
    "bind-key s display-popup -E -w 60% -h 50% '~/.config/tmux/scripts/fzf-session.sh'" \
    "bind-key s display-popup -E -w 60% -h 50% 'powershell -NoProfile -ExecutionPolicy Bypass -File ~/.config/tmux/scripts/fzf-session.ps1'"

# Reload. tmux can re-source ~ directly; psmux cannot, so it goes out through
# the shell, which expands $env:PSMUX_CONFIG_FILE for us.
if-shell 'test -d /etc' \
    'bind-key r source-file ~/.config/tmux/tmux.conf \; display-message "config reloaded"' \
    "bind-key r run-shell 'psmux source-file \$env:PSMUX_CONFIG_FILE' \; display-message 'config reloaded'"


# ============================================================
# Neovim-style command aliases
# ============================================================

# Splits
set -g command-alias 'sp=split-window -v -c "#{pane_current_path}"'
set -g command-alias 'split=split-window -v -c "#{pane_current_path}"'

set -g command-alias 'vs=split-window -h -c "#{pane_current_path}"'
set -g command-alias 'vsplit=split-window -h -c "#{pane_current_path}"'

# Panes
set -g command-alias 'q=kill-pane'
set -g command-alias 'only=kill-pane -a'

# Session
set -g command-alias 'qa=kill-session'

# Windows as Vim tabs
set -g command-alias 'tabnew=new-window -c "#{pane_current_path}"'
set -g command-alias 'tabn=next-window'
set -g command-alias 'tabnext=next-window'
set -g command-alias 'tabp=previous-window'
set -g command-alias 'tabprevious=previous-window'
set -g command-alias 'tabclose=kill-window'

# Windows as Vim buffers
set -g command-alias 'bn=next-window'
set -g command-alias 'bnext=next-window'
set -g command-alias 'bp=previous-window'
set -g command-alias 'bprevious=previous-window'
set -g command-alias 'bd=kill-window'
set -g command-alias 'bdelete=kill-window'

# Config
# Re-sources the generated entry file, so the plugin tail comes back too.
# psmux cannot expand ~, so this uses the same env var it was started from.
# On Linux $PSMUX_CONFIG_FILE is unset and tmux falls back to the XDG path.
set -g command-alias 'reload=source-file -q "${PSMUX_CONFIG_FILE}"'
set -g command-alias 'reloadx=source-file -q ~/.config/tmux/tmux.conf'


# ============================================================
# Plugins
# ============================================================
#
# This is the whole config, for both platforms. Nothing is generated and
# nothing lives outside the repo.
#
#   Linux    tmux finds this at ~/.config/tmux/tmux.conf (stowed symlink)
#   Windows  psmux is pointed here by $PSMUX_CONFIG_FILE (set by bootstrap.ps1)
#
# psmux and tmux differ in three ways that matter, so the split is done with
# if-shell rather than separate config files:
#   - psmux ships its own plugin manager (PPM); tmux uses TPM
#   - psmux copies to the system clipboard natively; tmux needs bindings
#   - the fzf pickers are .ps1 on Windows and .sh on Linux
#
# `test -d /etc` is the platform probe: true under Linux's shell, false under
# psmux's (PowerShell), whether `test` is missing entirely or scoop's coreutils
# supplies it. Verified against psmux 3.3.8 - correct branch, no warnings.
#
# The Linux tail is source-file'd because it is long and quoting the clipboard
# bindings inline would need three levels of nesting. The Windows tail is
# inlined because psmux cannot expand ~ in source-file and there is no absolute
# path that is valid on every machine.
#
# One if-shell per command: psmux accepts only a single command per if-shell.
# Neither `;` nor `\;` separates - both get swallowed into the preceding
# argument, which silently turns three commands into one bogus option value.
# `set -g @noop 1` is the do-nothing branch.

if-shell 'test -d /etc' \
    'source-file -q ~/.config/tmux/plugins.linux.conf' \
    "set -g @plugin 'psmux-plugins/ppm'"

if-shell 'test -d /etc' \
    'set -g @noop 1' \
    "set -g @plugin 'psmux-plugins/psmux-vim-navigator'"

# PPM must run after its @plugin lines.
if-shell 'test -d /etc' \
    'set -g @noop 1' \
    "run '~/.psmux/plugins/ppm/ppm.ps1'"

# ============================================================
# General
# ============================================================

# Good TERM value for Neovim/TUI applications.
set -g default-terminal "xterm-256color"

set -g mouse on
set -g focus-events on

# Large scrollback.
set -g history-limit 50000

# Responsive Escape/Alt handling.
set -g escape-time 10
# repeat-time lives in tmux.linux.conf: psmux does not implement it and warns
# on startup, and this file is shared with it.

# Start windows and panes at 1.
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# Vi keys in copy mode and command prompts.
set -g mode-keys vi
set -g status-keys vi

# psmux/PowerShell niceties.


# ============================================================
# Prefix
# ============================================================

# Ctrl-t instead of Ctrl-b.
unbind-key C-b
set -g prefix C-t

# Ctrl-t Ctrl-t sends a literal Ctrl-t to the application.
#
# That binding is Linux-only and lives in the %else branch at the bottom of
# this file. It used to be an if-shell here, which cost ~1300ms of startup all
# by itself - a whole PowerShell spawned just to run `test -d /etc`.


# ============================================================
# Command mode
# ============================================================

# Prefix + ; and Prefix + :
#
# `;` is the ergonomic one (no Shift). This used to be Alt-;, but Alt is the
# tiling WM modifier on both platforms - komorebi on Windows, i3 on Linux - so
# the WM swallowed it before the multiplexer ever saw it.
#
# This overrides tmux's default `;` = last-pane; use Prefix + o for zoom or
# Ctrl-h/j/k/l to move between panes.
bind-key ';' command-prompt -p ":"
bind-key ':' command-prompt -p ":"


# ============================================================
# Splits
# ============================================================

# Prefix + h
# Panes stacked vertically: one above the other.
# (tmux calls this -v, "split along a horizontal line".)
bind-key h split-window -v -c "#{pane_current_path}"

# Prefix + v
# Panes side by side.
bind-key v split-window -h -c "#{pane_current_path}"

# `s` is no longer a split - it is the fzf session picker. See the fzf section
# below.


# ============================================================
# Pane navigation
# ============================================================

# Ctrl-h/j/k/l is installed by psmux-vim-navigator.
#
# C-h -> left
# C-j -> down
# C-k -> up
# C-l -> right
#
# No prefix required.
#
# If Neovim is active, the plugin passes these keys to Neovim.
# At the edge of a Neovim split, vim-tmux-navigator moves into
# the surrounding psmux pane.


# ============================================================
# Pane resizing
# ============================================================

# Prefix + Shift-H/J/K/L
bind-key -r H resize-pane -L 5
bind-key -r J resize-pane -D 5
bind-key -r K resize-pane -U 5
bind-key -r L resize-pane -R 5

# Prefix + =
# Equalize panes.
bind-key = select-layout tiled

# Prefix + o
# Zoom/unzoom current pane.
bind-key o resize-pane -Z


# ============================================================
# Copy / selection mode
# ============================================================

# Prefix + Space
#
# Enter copy mode and immediately begin a selection.
bind-key Space copy-mode \; send-keys -X begin-selection

# Also make v work like Neovim once already in copy mode.
bind-key -T copy-mode-vi v send-keys -X begin-selection

# Ctrl-v toggles rectangular/block selection in copy mode.
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle

# psmux already provides:
#
#   h/j/k/l    move
#   w/b        word motion
#   0/$        line boundaries
#   g/G        top/bottom
#   /          search
#   y          copy selection to Windows clipboard + exit
#   Enter      copy selection to Windows clipboard + exit
#   q/Escape   cancel
#
# No tmux-yank plugin is required.


# ============================================================
# Windows / "tabs"
# ============================================================

# Prefix + c
# New window in current directory.
bind-key c new-window -c "#{pane_current_path}"

# Prefix + t
# Prompt for a name, then create a new window.
bind-key t command-prompt -p "Tab name:" \
    "new-window -n '%%' -c '#{pane_current_path}'"

# Prefix + n/p
bind-key n next-window
bind-key p previous-window


# ============================================================
# Neovim-style command aliases
# ============================================================

# Splits
set -g command-alias 'sp=split-window -v -c "#{pane_current_path}"'
set -g command-alias 'split=split-window -v -c "#{pane_current_path}"'

set -g command-alias 'vs=split-window -h -c "#{pane_current_path}"'
set -g command-alias 'vsplit=split-window -h -c "#{pane_current_path}"'

# Panes
set -g command-alias 'q=kill-pane'
set -g command-alias 'only=kill-pane -a'

# Session
set -g command-alias 'qa=kill-session'

# Windows as Vim tabs
set -g command-alias 'tabnew=new-window -c "#{pane_current_path}"'
set -g command-alias 'tabn=next-window'
set -g command-alias 'tabnext=next-window'
set -g command-alias 'tabp=previous-window'
set -g command-alias 'tabprevious=previous-window'
set -g command-alias 'tabclose=kill-window'

# Windows as Vim buffers
set -g command-alias 'bn=next-window'
set -g command-alias 'bnext=next-window'
set -g command-alias 'bp=previous-window'
set -g command-alias 'bprevious=previous-window'
set -g command-alias 'bd=kill-window'
set -g command-alias 'bdelete=kill-window'

# `reload` is defined per platform, in tmux.linux.conf / tmux.windows.conf:
# tmux can re-source a ~ path directly, psmux has to go out through the shell.


# ============================================================
# Platform split - KEEP THIS LAST
# ============================================================
#
# One config for both. Nothing generated, nothing outside the repo.
#
#   Linux    tmux finds this at ~/.config/tmux/tmux.conf (stowed symlink)
#   Windows  psmux is pointed here by $PSMUX_CONFIG_FILE (bootstrap.ps1 sets it
#            at User scope; powershell/profile.ps1 sets it as a fallback)
#
# ---------------------------------------------------------------------------
# %if, NOT if-shell
# ---------------------------------------------------------------------------
# This used to be 8 separate `if-shell 'test -d /etc'` lines. Each one spawns a
# whole PowerShell just to evaluate the test, and that was 94% of psmux startup:
#
#   full config ......................... 4224 ms
#   same config, if-shell lines deleted .. 232 ms
#   cost per if-shell .................... ~270 ms
#
# %if is evaluated internally - no shell, ~16ms for the whole block - and it
# takes MULTIPLE commands per branch, which also removes the one-command-per-
# if-shell limit that forced the old `set -g @noop 1` filler lines.
#
# The probe is the socket path, the one format that differs by platform without
# asking a shell. On Windows it is a drive-letter path so it contains a colon;
# on Linux it is under /tmp and contains none.

%if "#{m:*:*,#{socket_path}}"

    # ---------------- Windows / psmux ----------------

    # NO PLUGINS. psmux-vim-navigator alone cost 1330-2600ms of startup - it
    # spawns a background poller to detect Neovim - and PPM existed only to
    # install it. Measured:
    #
    #   empty config ............................  200 ms
    #   + @plugin psmux-vim-navigator ........... 1556 ms  (pwsh absent)
    #   + @plugin psmux-vim-navigator ........... 2638 ms  (pwsh installed,
    #                                                       poller actually runs)
    #   4 format-based bindings below ...........  ~0 ms
    #
    # The bindings replace it. `if-shell -F` evaluates a FORMAT rather than
    # spawning a shell, and it runs at KEY PRESS, not at startup - so this costs
    # nothing to register. When the focused pane is running Neovim the key is
    # forwarded to it; otherwise it moves between psmux panes.
    bind-key -n C-h if-shell -F '#{m:*nvim*,#{pane_current_command}}' 'send-keys C-h' 'select-pane -L'
    bind-key -n C-j if-shell -F '#{m:*nvim*,#{pane_current_command}}' 'send-keys C-j' 'select-pane -D'
    bind-key -n C-k if-shell -F '#{m:*nvim*,#{pane_current_command}}' 'send-keys C-k' 'select-pane -U'
    bind-key -n C-l if-shell -F '#{m:*nvim*,#{pane_current_command}}' 'send-keys C-l' 'select-pane -R'

    # psmux-only option; tmux would warn about it.
    set -g prediction-dimming off

    # Built-in choosers rather than fzf popups. display-popup could not be made
    # to launch an external command: psmux passes escaped quotes through
    # literally so argv came out malformed ("Failed to start popup shell"), and
    # PowerShell additionally refuses to resolve ~ in a -File argument.
    # choose-window / choose-session are internal - no popup shell, no argv, no
    # path expansion - so there is nothing to misquote.
    bind-key b choose-window
    bind-key s choose-session

    # Reload goes out through the shell, which expands the variable for us.
    # Safe here because it re-sources the ENTRY file, so bindings come back.
    bind-key r run-shell 'psmux source-file $env:PSMUX_CONFIG_FILE'

%else

    # ---------------- Linux / tmux ----------------

    # tmux keeps send-prefix on the OLD key when `prefix` changes, so it needs
    # rebinding explicitly. psmux rebinds it automatically.
    bind-key C-t send-prefix

    # Everything else lives in one file, because tmux CAN expand ~ here.
    source-file -q ~/.config/tmux/tmux.linux.conf

%endif

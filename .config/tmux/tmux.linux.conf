# Linux / tmux specific configuration.
#
# Sourced from the tail of tmux.conf via if-shell. The Windows half is inlined
# there instead of living in its own file - see that comment for why.
#
# Unlike psmux, tmux does NOT copy to the system clipboard out of the box, so
# the copy-mode bindings that are free on Windows have to be wired up here.

# --- options psmux does not implement ----------------------------------------
# Kept out of the shared tmux.conf so psmux does not warn on every startup.
set -g repeat-time 500

# --- clipboard ----------------------------------------------------------------
# Prefer Wayland's wl-copy, fall back to xclip under X11.
if-shell 'command -v wl-copy >/dev/null' \
  "bind-key -T copy-mode-vi y     send-keys -X copy-pipe-and-cancel 'wl-copy'; \
   bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel 'wl-copy'" \
  "bind-key -T copy-mode-vi y     send-keys -X copy-pipe-and-cancel 'xclip -selection clipboard -in'; \
   bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel 'xclip -selection clipboard -in'"

# --- fzf pickers --------------------------------------------------------------
# Windows counterparts live in tmux.windows.conf.

bind-key b display-popup -E -w 80% -h 70% '~/.config/tmux/scripts/fzf-window.sh'
bind-key s display-popup -E -w 60% -h 50% '~/.config/tmux/scripts/fzf-session.sh'

# --- reload -------------------------------------------------------------------
# tmux expands ~ in source-file, so this can be direct; psmux cannot and has to
# go through the shell. Hence one per platform rather than one shared binding.
bind-key r source-file ~/.config/tmux/tmux.conf \; display-message "tmux config reloaded"
set -g command-alias 'reload=source-file ~/.config/tmux/tmux.conf'

# --- plugins ------------------------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Seamless Ctrl-h/j/k/l between Neovim and tmux. The psmux equivalent is
# psmux-plugins/psmux-vim-navigator.
set -g @plugin 'christoomey/vim-tmux-navigator'

# TPM must remain at the bottom.
run '~/.config/tmux/plugins/tpm/tpm'

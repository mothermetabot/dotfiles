# Plugin tail for psmux (Windows). Sourced via plugins.conf, which bootstrap.ps1
# points here.
#
# psmux already provides, natively and with no plugin:
#   h/j/k/l  move        w/b  word motion      0/$  line boundaries
#   g/G      top/bottom  /    search           q/Escape  cancel
#   y        copy selection to the Windows clipboard + exit
#   Enter    copy selection to the Windows clipboard + exit
# so no tmux-yank equivalent is needed here. The Linux side has to add those
# bindings by hand - see plugins.linux.conf.

# PPM: psmux's native PowerShell plugin manager.
set -g @plugin 'psmux-plugins/ppm'

# Seamless Ctrl-h/j/k/l between Neovim and psmux.
set -g @plugin 'psmux-plugins/psmux-vim-navigator'

# PPM must remain at the bottom.
run '~/.psmux/plugins/ppm/ppm.ps1'

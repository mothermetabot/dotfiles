"$schema" = 'https://starship.rs/config-schema.json'

# =============================================================================
# PERFORMANCE NOTES - read before adding anything here
# =============================================================================
#
# Measured on this machine with `starship timings` and wall-clock medians:
#
#   spawn floor (cmd /c exit) ..........   9 ms
#   starship --version .................  19 ms
#   THIS config, in a git repo .........  ~20 ms
#   ...with any starship git module .... ~147 ms
#
# Two rules keep it there:
#
# 1. NO starship git modules. The cost is not the branch lookup, it is
#    starship OPENING the repository - so a single git module pays the whole
#    ~130ms, and adding more costs nothing extra. `directory` also opens the
#    repo when truncate_to_repo is on (its default), which is why it showed as
#    143-215ms in timings; the bigger the repo, the worse.
#
#    The branch is still displayed. powershell/functions/git-branch-fast.ps1
#    reads .git/HEAD directly - 0.16ms - and publishes it as
#    $STARSHIP_GIT_BRANCH, which the [env_var] module below renders without
#    touching git at all.
#
# 2. `format` MUST stay above every [table]. In TOML a bare key after a table
#    header belongs to THAT table, so this file previously had `format` sitting
#    under [git_status] - it became git_status.format, the root format was
#    never applied, and the prompt silently used starship's default (which runs
#    every git module). That single misplacement was most of the slowness.
#
# `starship timings` lists EVERY module, not just the ones in the format, so
# entries there for modules you do not use (battery, pijul_channel, ...) are
# not evidence they run.

add_newline = false

# $line_break puts the λ on its own line, so long paths never squeeze the
# place you actually type. It is a pure formatting module - no cost.
format = "$directory${env_var.git_branch}$line_break$character"

# =============================================================================

[directory]
# Off because it makes directory open the git repo just to find the root.
truncate_to_repo = false
truncation_length = 3

# Branch from $STARSHIP_GIT_BRANCH, set by git-branch-fast.ps1. No repo access.
[env_var.git_branch]
variable = 'STARSHIP_GIT_BRANCH'
format = 'on [ $env_value](bold purple) '

[character]
success_symbol = '[λ](bold fg:#db7e41)'
error_symbol = '[λ](bold red)'

# Explicitly off. Not needed on a desktop, and battery polling showed 10-12ms.
[battery]
disabled = true
